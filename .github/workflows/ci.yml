name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm build:registry

      - name: Typecheck
        run: pnpm typecheck

      - name: Test CLI
        run: pnpm test

      - name: Build CLI
        run: pnpm build:cli

      - name: Build docs site
        run: pnpm build:www

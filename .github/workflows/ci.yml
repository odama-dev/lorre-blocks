name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm build:registry

      # The registry build regenerates tracked output (src/styles/theme.css);
      # a diff here means someone changed tokens without rebuilding, or the
      # build stopped being deterministic.
      - name: Check generated files are in sync
        run: git diff --exit-code

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (cli, registry, www render smoke)
        run: pnpm test

      - name: Build CLI
        run: pnpm build:cli

      - name: Build MCP server
        run: pnpm build:mcp

      - name: Build docs site
        run: pnpm build:www
